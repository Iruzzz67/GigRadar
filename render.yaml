services:
  - type: web
    name: gigradar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/events
    envVars:
      - key: JwtSettings__SecretKey
        generateValue: true          # secret acak otomatis oleh Render
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # PostgreSQL (Neon) — paste connection string pooled dari dashboard Neon
      # ke env var DATABASE_URL saat deploy. Jangan commit kredensial ke repo.
      - key: DATABASE_URL
        sync: false
