services:
  - type: web
    name: gigradar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/events
    envVars:
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JwtSettings__SecretKey
        generateValue: true          # secret acak otomatis oleh Render
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # SQLite ditulis ke /app/data — di free plan TANPA disk (butuh kartu),
      # path ini ephemeral: data demo reset saat instance tidur/re-deploy.
      # Untuk data permanen, tambahkan kembali blok disk + instance paid.
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/app/data/GigRadar.db"
